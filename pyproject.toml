[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "psu-analytics"
version = "0.1.0"
description = "Penn State football analytics on CollegeFootballData"
requires-python = ">=3.11"
dependencies = [
    "cfbd>=5.29,<6",
    "duckdb>=1.1",
    "pandas>=2.2",
    "python-dotenv>=1.0",
    "scikit-learn>=1.5",
    "scipy>=1.11",
    "streamlit>=1.40",
    "xgboost>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
psu = "psu.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/psu"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["docs"]  # plans embed historical code snippets; leave them as written

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["B008"]
